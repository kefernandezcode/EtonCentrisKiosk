
name: Deploy Kiosk to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download LFS files
        run: |
          git lfs install
          git lfs pull
          git lfs checkout

      - name: Verify screensaver video
        run: |
          VIDEO="assets/videos/screensaver.mp4"

          echo "Checking screensaver video..."
          ls -lh "$VIDEO"
          file "$VIDEO"

          if grep -aq "^version https://git-lfs.github.com/spec/v1" "$VIDEO"; then
            echo "ERROR: Video is still an LFS pointer."
            exit 1
          fi

          test "$(stat -c%s "$VIDEO")" -gt 1024

          echo "Actual video file verified successfully."
          echo "Video size in bytes:"
          stat -c%s "$VIDEO"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
