<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#fff8f2"/>
<title>The New Eton Centris Station</title>
<link href="css/style.css" rel="stylesheet"/>
<link href="css/theme.css" rel="stylesheet"/>
<link href="css/artwork.css" rel="stylesheet"/>
<link href="css/branding.css" rel="stylesheet"/>
<link href="css/new-station.css" rel="stylesheet"/>
<link rel="stylesheet" href="css/premium-finishing.css"/>
<link rel="stylesheet" href="css/layout-v20.css"/>
<link rel="stylesheet" href="css/layout-v22.css"/>
<script src="js/page-transitions.js"></script>
<link rel="stylesheet" href="css/layout-v24.css"/>
<link rel="stylesheet" href="css/layout-v26.css"/>
</head>
<body class="new-station-page">
<main class="new-station-screen">
  <header class="brand-header new-station-brand"><img class="brand-logo" src="assets/logos/eton-centris-station.png" alt="Eton Centris Station" draggable="false"/></header>
  <section class="new-station-heading"><h1 class="artwork-title"><img src="assets/titles/title-new-station-balanced.png" alt="THE NEW Eton Centris Station" draggable="false" width="1376" height="317"/></h1></section>
  <section class="station-carousel" aria-label="Architectural render gallery" aria-roledescription="carousel">
    <div class="carousel-stage" id="carousel-stage" tabindex="0" aria-label="Image gallery. Use left and right arrow keys or swipe to change image.">
        <div class="carousel-slide is-prev" data-index="0" aria-hidden="true"><img src="assets/images/render1.png" alt="Wide exterior facade" draggable="false" width="960" height="624"/></div>
        <div class="carousel-slide is-current" data-index="1" aria-hidden="false"><img src="assets/images/render2.png" alt="New Eton Centris Station facade" draggable="false" width="960" height="624"/></div>
        <div class="carousel-slide is-next" data-index="2" aria-hidden="true"><img src="assets/images/render3.png" alt="Escalator lobby" draggable="false" width="960" height="624"/></div>
        <div class="carousel-slide" data-index="3" aria-hidden="true"><img src="assets/images/render4.png" alt="Lounge area" draggable="false" width="960" height="623"/></div>
        <div class="carousel-slide" data-index="4" aria-hidden="true"><img src="assets/images/render5.png" alt="Interior corridor" draggable="false" width="960" height="623"/></div>
        <div class="carousel-slide" data-index="5" aria-hidden="true"><img src="assets/images/render6.png" alt="Open lobby" draggable="false" width="960" height="624"/></div>
      <button class="carousel-arrow carousel-prev" type="button" aria-label="Previous image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
      <button class="carousel-arrow carousel-next" type="button" aria-label="Next image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
    <div class="station-caption is-revealing" aria-live="polite" aria-atomic="true">
      <span class="caption-brand">ETON CENTRIS STATION</span>
      <span class="caption-name">Facade</span>
      <span class="caption-divider" aria-hidden="true"></span>
    </div>
    <div class="carousel-thumbs" role="group" aria-label="Gallery thumbnails">
      <button class="carousel-thumb" type="button" data-index="0" aria-label="Show image 1: Eton Centris Station Facade" aria-pressed="false"><img src="assets/images/render1.png" alt="" draggable="false"/></button>
      <button class="carousel-thumb" type="button" data-index="1" aria-label="Show image 2: Eton Centris Station Facade" aria-pressed="true"><img src="assets/images/render2.png" alt="" draggable="false"/></button>
      <button class="carousel-thumb" type="button" data-index="2" aria-label="Show image 3: Eton Centris Station Lobby" aria-pressed="false"><img src="assets/images/render3.png" alt="" draggable="false"/></button>
      <button class="carousel-thumb" type="button" data-index="3" aria-label="Show image 4: Eton Centris Station Lobby" aria-pressed="false"><img src="assets/images/render4.png" alt="" draggable="false"/></button>
      <button class="carousel-thumb" type="button" data-index="4" aria-label="Show image 5: Eton Centris Station Hallway" aria-pressed="false"><img src="assets/images/render5.png" alt="" draggable="false"/></button>
      <button class="carousel-thumb" type="button" data-index="5" aria-label="Show image 6: Eton Centris Station Ground Floor Concourse" aria-pressed="false"><img src="assets/images/render6.png" alt="" draggable="false"/></button>
    </div>
  </section>
  <a class="back-home" href="home.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg><span class="button-label">BACK TO HOME</span></a>
</main>
<script src="js/new-station.js"></script>
<script src="js/idle-timer.js"></script>
</body>
</html>
